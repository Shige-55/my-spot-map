name: 招待制アプリの検証

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'publish' || 'verify' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: 検証と公開用ビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: lockfileから依存を導入
        run: npm ci
      - name: Chromiumと必要なOSライブラリを導入
        run: npx playwright install --with-deps chromium
      - name: lint
        run: npm run lint
      - name: 単体・画面・PWA・招待制テスト
        run: npm test
      - name: 招待制アプリをビルド
        run: npm run build
      - name: 配信資産と認証モードを検証
        run: npm run verify:dist
